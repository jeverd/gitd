<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gitd</title>
<style>
  :root { --fg: #000; --bg: #fff; --line: 1px solid #000; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
  header { display: flex; justify-content: space-between; align-items: baseline; padding: 12px 20px; border-bottom: var(--line); }
  header h1 { margin: 0; font-size: 18px; letter-spacing: 0.04em; }
  header .meta { color: #000; opacity: 0.6; }
  main { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); min-height: calc(100vh - 49px); }
  section { padding: 16px 20px; min-width: 0; }
  section + section { border-left: var(--line); }
  h2 { margin: 0 0 12px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em; }
  .repo { border: var(--line); margin-bottom: 16px; }
  .repo-name { padding: 6px 10px; border-bottom: var(--line); font-weight: 700; display: flex; justify-content: space-between; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 4px 10px; vertical-align: top; white-space: nowrap; }
  th { font-weight: 400; opacity: 0.6; border-bottom: 1px dashed #000; }
  td.subject { white-space: normal; word-break: break-word; }
  tr.fresh td { background: #000; color: #fff; }
  .empty { padding: 8px 10px; opacity: 0.6; }
  ol#events, ol#deliveries { list-style: none; margin: 0; padding: 0; }
  #deliveries li { border-bottom: 1px dashed #000; padding: 4px 0; }
  #deliveries li.failed { background: #000; color: #fff; padding-left: 6px; }
  #deliveries .empty { opacity: 0.6; border: 0; }
  #events li { border-bottom: 1px dashed #000; padding: 5px 0; display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 8px; }
  #events li .when { opacity: 0.6; }
  #events li .what { word-break: break-word; }
  #events li.reject { background: #000; color: #fff; padding-left: 6px; }
  #events li.reject .when { opacity: 0.8; }
  .kind { font-weight: 700; }
  .oid { opacity: 0.7; }
  tr[data-branch] a { color: inherit; }
  tr.selected td:first-child::before { content: "▸ "; }
  #browser { border: var(--line); margin-top: 8px; }
  #browser .bar { padding: 6px 10px; border-bottom: var(--line); display: flex; gap: 12px; flex-wrap: wrap; }
  #browser a { color: inherit; cursor: pointer; text-decoration: underline; }
  #browser .entries { padding: 6px 10px; }
  #browser .entries div { padding: 2px 0; }
  #browser pre { margin: 0; padding: 10px; border-top: var(--line); white-space: pre-wrap; word-break: break-word; max-height: 420px; overflow: auto; }
  #browser pre .add { font-weight: 700; }
  #browser pre .del { text-decoration: line-through; opacity: 0.6; }
  #browser pre .hunk { opacity: 0.6; }
</style>
</head>
<body>
<header>
  <h1>gitd</h1>
  <span class="meta" id="status">connecting…</span>
</header>
<main>
  <section>
    <h2>Repos</h2>
    <div id="repos"><div class="empty">No repos yet.</div></div>
    <h2 id="browser-title" hidden>Files</h2>
    <div id="browser" hidden></div>
  </section>
  <section>
    <h2>Webhook deliveries</h2>
    <ol id="deliveries"><li class="empty">No webhooks yet.</li></ol>
    <h2 style="margin-top:20px">Activity</h2>
    <ol id="events"></ol>
  </section>
</main>
<script>
"use strict";
// Every value from the server is untrusted (agents write commit messages
// and branch names), so text is only ever set with textContent.
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
};
const short = (oid) => (oid && !/^0+$/.test(oid) ? oid.slice(0, 7) : "-");
const clock = (unix) => new Date(unix * 1000).toLocaleTimeString([], { hour12: false });
const ago = (unix, now) => {
  const s = Math.max(0, now - unix);
  return s < 60 ? s + "s ago" : s < 3600 ? Math.floor(s / 60) + "m ago" : Math.floor(s / 3600) + "h ago";
};
const branchName = (ref) => ref.replace(/^refs\/heads\//, "");
const left = (until, now) => {
  const s = until - now;
  return s <= 0 ? "expiring…" : s < 60 ? "in " + s + "s" : s < 3600 ? "in " + Math.ceil(s / 60) + "m" : "in " + Math.ceil(s / 3600) + "h";
};

let lastEvent = 0;
// The branch whose files are open: { repo, branch, dir, file }.
let browse = null;
const repoApi = (repo, rest) => "/ui/api/repos/" + repo + "/" + rest;
const enc = (path) => path.split("/").map(encodeURIComponent).join("/");

async function openBrowser(repo, branch, dir, file, diff) {
  browse = { repo, branch, dir: dir || "", file: file || "", diff: !!diff };
  const box = $("browser");
  const ref = "?ref=" + encodeURIComponent(branch);
  const tree = await fetch(repoApi(repo, browse.dir ? "tree/" + enc(browse.dir) : "tree") + ref).then((r) => r.json());
  box.replaceChildren();
  const bar = el("div", "bar");
  const crumbs = el("span", "crumbs");
  crumbs.append(el("strong", "", repo + " @ " + branch), document.createTextNode(" "));
  const link = (text, go) => { const a = el("a", "", text); a.href = "#"; a.onclick = (ev) => { ev.preventDefault(); go(); }; return a; };
  const root = link("/", () => openBrowser(repo, branch, ""));
  crumbs.append(root);
  let acc = "";
  for (const part of browse.dir ? browse.dir.split("/") : []) {
    acc = acc ? acc + "/" + part : part;
    const target = acc;
    crumbs.append(link(part + "/", () => openBrowser(repo, branch, target)));
  }
  bar.append(crumbs, el("span", "oid", "commit " + short(tree.commit)));
  if (branch !== "main") bar.append(link("diff vs main", () => openBrowser(repo, branch, browse.dir, "", true)));
  box.append(bar);
  const list = el("div", "entries");
  for (const e of tree.entries || []) {
    const row = el("div");
    const dir = browse.dir;
    const a = link(e.name + (e.type === "tree" ? "/" : ""), () => (e.type === "tree" ? openBrowser(repo, branch, e.path) : openBrowser(repo, branch, dir, e.path)));
    row.append(a, document.createTextNode(e.size != null ? "  " + e.size + " B" : ""));
    list.append(row);
  }
  box.append(list);
  if (browse.diff) {
    const cmp = await fetch(repoApi(repo, "compare/main..." + branch)).then((r) => r.json());
    const files = (cmp.files || []).map((f) => `${f.status} ${f.path} +${f.additions ?? "?"} -${f.deletions ?? "?"}`).join("   ");
    box.append(el("div", "bar", `diff main...${branch}: ${cmp.ahead} ahead, ${cmp.behind} behind · ${files}`));
    const pre = el("pre");
    pre.dataset.diff = branch;
    for (const line of (cmp.patch || "").split("\n")) {
      const cls = line.startsWith("+") && !line.startsWith("+++") ? "add" : line.startsWith("-") && !line.startsWith("---") ? "del" : line.startsWith("@@") ? "hunk" : "";
      pre.append(el("span", cls, line + "\n"));
    }
    box.append(pre);
  }
  if (browse.file) {
    const text = await fetch(repoApi(repo, "files/" + enc(browse.file)) + ref).then((r) => r.text());
    const pre = el("pre", "", text);
    pre.dataset.file = browse.file;
    box.append(el("div", "bar", browse.file), pre);
  }
  $("browser-title").hidden = false;
  box.hidden = false;
  lastReposKey = "";
}
let lastHeads = new Map();

function describe(e) {
  const ref = branchName(e.ref);
  switch (e.kind) {
    case "repo_created": return ["repo created", e.repo];
    case "repo_deleted": return ["repo deleted", e.repo];
    case "push":
      if (e.detail === "created") return ["push", `${e.repo} ${ref} created at ${short(e.new)}`];
      if (e.detail === "deleted") return ["push", `${e.repo} ${ref} deleted`];
      return ["push", `${e.repo} ${ref} ${short(e.old)} → ${short(e.new)}`];
    case "push_rejected": return ["push REJECTED", `${e.repo} ${ref}: ${e.detail}`];
    case "commit": return ["commit", `${e.repo} ${ref} ${short(e.old)} → ${short(e.new)} "${e.detail}"`];
    case "commit_conflict": return ["commit CONFLICT", `${e.repo} ${ref}: built on ${short(e.old)}, branch is at ${short(e.new)} → 409`];
    case "branch_created": return ["branch created", `${e.repo} ${ref} at ${short(e.new)}`];
    case "branch_deleted": return ["branch deleted", `${e.repo} ${ref}`];
    case "merge": return ["merge", `${e.repo} ${e.detail}: ${short(e.old)} → ${short(e.new)}`];
    case "branch_expired": return ["branch expired", `${e.repo} ${ref} (was at ${short(e.old)})`];
    case "merge_conflict": return ["merge CONFLICT", `${e.repo} ${e.detail} → 409`];
    case "rule_created": return ["rule created", `${e.repo} ${ref} (${e.detail})`.trim()];
    case "rule_deleted": return ["rule deleted", `${e.repo} ${e.detail}`.trim()];
    case "rule_rejected": return ["rule REJECTED", `${e.repo} ${ref}: ${e.detail}`];
    case "quota_exceeded": return ["quota EXCEEDED", `${e.repo} ${ref}: ${e.detail}`.trim()];
    case "gc_completed": return ["gc completed", `${e.repo} (${e.detail})`.trim()];
    default: return [e.kind.replace(/_/g, " "), `${e.repo} ${ref} ${e.detail}`.trim()];
  }
}

function renderEvents(list) {
  const ol = $("events");
  for (const e of list) {
    const [kind, what] = describe(e);
    const li = el("li", /rejected|conflict|failed|exceeded/.test(e.kind) ? "reject" : "");
    li.dataset.kind = e.kind;
    li.append(el("span", "when", clock(e.created_at)));
    const w = el("span", "what");
    w.append(el("span", "kind", kind), document.createTextNode(" " + what));
    li.append(w);
    ol.prepend(li);
    lastEvent = Math.max(lastEvent, e.id);
  }
  while (ol.children.length > 300) ol.lastChild.remove();
}

let lastReposKey = "";
function renderRepos(state) {
  // Rebuild only when something changed, so links stay put between polls;
  // otherwise just refresh the relative times.
  const key = JSON.stringify(state.repos) + "|" + (browse ? browse.repo + " " + browse.branch : "");
  if (key === lastReposKey) {
    for (const td of document.querySelectorAll("td[data-at]")) td.textContent = ago(Number(td.dataset.at), state.now);
    for (const td of document.querySelectorAll("td[data-until]")) td.textContent = left(Number(td.dataset.until), state.now);
    for (const tr of document.querySelectorAll("tr.fresh")) tr.classList.remove("fresh");
    return;
  }
  lastReposKey = key;
  const box = $("repos");
  box.replaceChildren();
  if (state.repos.length === 0) { box.append(el("div", "empty", "No repos yet.")); return; }
  const heads = new Map();
  for (const repo of state.repos) {
    const card = el("div", "repo");
    const title = el("div", "repo-name");
    title.append(el("span", "", repo.name), el("span", "meta", repo.branches.length + " branches"));
    card.append(title);
    if (repo.branches.length === 0) {
      card.append(el("div", "empty", "empty: no branches"));
    } else {
      const table = el("table");
      const head = el("tr");
      for (const h of ["branch", "commit", "updated", "expires", "message"]) head.append(el("th", "", h));
      table.append(head);
      for (const b of repo.branches) {
        const key = repo.name + " " + b.name;
        heads.set(key, b.commit);
        const fresh = lastHeads.size && lastHeads.get(key) !== b.commit;
        const chosen = browse && browse.repo === repo.name && browse.branch === b.name;
        const tr = el("tr", (fresh ? "fresh " : "") + (chosen ? "selected" : ""));
        tr.dataset.branch = b.name;
        const link = el("a", "", b.name);
        link.href = "#";
        link.onclick = (ev) => { ev.preventDefault(); openBrowser(repo.name, b.name, ""); };
        const nameCell = el("td");
        nameCell.append(link);
        if (b.locked) {
          const badge = el("span", "oid", " [LOCKED]");
          badge.title = b.lock_reason || "locked";
          nameCell.append(badge);
        }
        const when = el("td", "", ago(b.committed_at, state.now));
        when.dataset.at = b.committed_at;
        const expires = el("td", "", b.expires_at ? left(b.expires_at, state.now) : "never");
        if (b.expires_at) expires.dataset.until = b.expires_at;
        tr.append(nameCell, el("td", "oid", short(b.commit)), when, expires, el("td", "subject", b.subject));
        table.append(tr);
      }
      card.append(table);
    }
    box.append(card);
  }
  lastHeads = heads;
}

function renderDeliveries(list) {
  const ol = $("deliveries");
  if (list.length === 0) return;
  ol.replaceChildren();
  for (const d of list) {
    const host = d.url.replace(/^https?:\/\/[^/]*/, "");
    const tries = d.attempts + (d.attempts === 1 ? " try" : " tries");
    const how = d.status === "delivered" ? `delivered (${d.last_status})`
      : d.status === "failed" ? `FAILED: ${d.last_error}`
      : d.attempts ? `retrying: ${d.last_error}` : d.status;
    const li = el("li", d.status === "failed" ? "failed" : "");
    li.dataset.status = d.status;
    li.append(el("span", "kind", `#${d.id} ${d.event.kind.replace(/_/g, " ")}`),
              document.createTextNode(` ${branchName(d.event.ref) || d.event.repo} → ${host} · ${how} · ${tries}`));
    ol.append(li);
  }
}

async function tick() {
  try {
    const [state, events, deliveries] = await Promise.all([
      fetch("/ui/api/state").then((r) => r.json()),
      fetch("/ui/api/events?after=" + lastEvent).then((r) => r.json()),
      fetch("/ui/api/deliveries").then((r) => r.json()),
    ]);
    renderRepos(state);
    renderEvents(events.events);
    renderDeliveries(deliveries.deliveries);
    $("status").textContent = "live · " + clock(state.now);
  } catch (err) {
    $("status").textContent = "disconnected";
  }
  setTimeout(tick, 1000);
}
tick();
</script>
</body>
</html>
