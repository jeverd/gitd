name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, test & e2e (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsqlite3-dev libgit2-dev pkg-config git curl

      - name: Format & Zig 0.17 API check
        run: |
          zig version
          zig build fmt-check
          python3 .claude/skills/zig/scripts/check_deprecated.py --review src build.zig

      - name: Unit tests (Debug & ReleaseSafe)
        run: |
          timeout 120 zig build test --summary all
          timeout 120 zig build test -Doptimize=ReleaseSafe --summary all

      - name: End-to-end tests (Debug)
        run: |
          zig build
          tests/e2e/run.sh zig-out/bin/gitd

      - name: End-to-end tests (ReleaseSafe)
        run: |
          zig build -Doptimize=ReleaseSafe
          tests/e2e/run.sh zig-out/bin/gitd
