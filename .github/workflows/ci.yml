name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, test & e2e (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install system dependencies & Zig 0.17.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsqlite3-dev libgit2-dev pkg-config git curl xz-utils
          ZIG_VERSION="$(sed -n 's/.*\.minimum_zig_version = "\(.*\)".*/\1/p' build.zig.zon)"
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" -o /tmp/zig.tar.xz
          sudo mkdir -p /opt/zig
          sudo tar -xJf /tmp/zig.tar.xz -C /opt/zig --strip-components=1
          rm /tmp/zig.tar.xz
          echo "/opt/zig" >> "$GITHUB_PATH"

      - name: Format & Zig 0.17 API check
        run: |
          zig version
          zig build fmt-check
          python3 .claude/skills/zig/scripts/check_deprecated.py --review src build.zig

      - name: Unit tests (Debug & ReleaseSafe)
        run: |
          zig build test
          zig build test -Doptimize=ReleaseSafe

      - name: End-to-end tests (Debug)
        run: |
          zig build
          tests/e2e/run.sh zig-out/bin/gitd

      - name: End-to-end tests (ReleaseSafe)
        run: |
          zig build -Doptimize=ReleaseSafe
          tests/e2e/run.sh zig-out/bin/gitd
